# ---------------------------------------------------------------------------
# 宝塔面板（BT Panel）专用 —— Nginx 反向代理到容器
#
# 背景：宝塔的 Nginx 已占用 80/443，容器不能再抢（会报 address already in use）。
# 做法：容器只暴露 3100，由宝塔的 Nginx 反代 80/443 → 127.0.0.1:3100。
#
# ── 用法（推荐方式一，最省事）──────────────────────────────────
# 方式一：面板建反代 + 补关键三行
#   1. 宝塔面板 → 网站 → 点站点名 → 设置 → 反向代理 → 添加反向代理
#      代理名称：kb        目标 URL：http://127.0.0.1:3100
#   2. 面板自动生成的配置【不支持 SSE】，进「配置文件」补上下面三行（见文件末尾
#      【必须补的三行】），否则 AI 助手的回答会攒到最后一次性吐出。
#
# 方式二：整体替换站点配置
#   面板 → 网站 → 站点设置 → 配置文件，用本文件的 server 块整体替换。
#   注意：先备份原配置（宝塔会自动 include 伪静态等规则，替换会丢失）。
#
# 改完记得：sudo nginx -t && sudo /etc/init.d/nginx reload
# ---------------------------------------------------------------------------

upstream kb_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    # ⚠️ 两个拼写都写上：DNS 用的是 baby，服务器目录是 bady。
    #    只写一个会导致另一个落到宝塔默认站点（表现为"能 ping 通但页面不对"）。
    server_name baby.mingboai.com bady.mingboai.com;

    # 知识库 MD 导入走 multipart，默认 1m 会 413
    client_max_body_size 20m;

    # 宝塔默认给静态站点加的缓存规则，反代场景要关掉，否则页面被缓存住
    # （若面板里开了"网站缓存/伪静态"，一并关掉或在本 server 内覆盖）

    location / {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # 邀请链接据此生成 https
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # ===== 下面三组是 SSE 流式输出的关键，缺一不可 =====
        proxy_buffering off;          # 不缓冲，逐字输出
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;      # 长对话推理耗时较长
    }

    # Next 构建产物是 hash 文件名，可安全长缓存
    location /_next/static/ {
        proxy_pass http://kb_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 邀请二维码短缓存即可
    location /api/invite/qr {
        proxy_pass http://kb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    # 别把源码/数据目录暴露出去
    location ~ /\.(git|env) {
        deny all;
    }

    access_log /www/wwwlogs/kb.mingboai.com.log;
    error_log  /www/wwwlogs/kb.mingboai.com.error.log;
}

# ---------------------------------------------------------------------------
# HTTPS：直接在宝塔面板申请最省事
#   网站 → 站点设置 → SSL → Let's Encrypt → 申请（勾选强制 HTTPS）
# 面板会自动生成 443 server 块并把 80 做 301 跳转，无需手写。
# ⚠️ 但面板生成的 443 块同样缺 SSE 三行，申请完记得补（同上）。
#
# 【必须补的三行】（粘贴进 location / { ... } 内部即可）
#     proxy_buffering off;
#     proxy_request_buffering off;
#     add_header X-Accel-Buffering no;
# ---------------------------------------------------------------------------
