# 好宝宝育儿知识库 —— Nginx 反向代理
#
# 目标：去掉端口号，直接用 https://baby.mingboai.com 访问
# 用法（Ubuntu/Debian 宿主机）：
#   sudo cp deploy/nginx/baby.mingboai.com.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d baby.mingboai.com      # 签发证书后会自动改写为 HTTPS
#
# 容器内 Next 仍监听 3100（见 docker-compose.yml 的 127.0.0.1:3100:3100），
# 这里由 Nginx 对外接管 80/443。

upstream kb_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name baby.mingboai.com;

    # 知识库 MD 导入走 multipart，默认 1m 会 413
    client_max_body_size 20m;

    # 证书签发后，certbot 会自动把这段改写为 301 跳转；未签证书时保持注释
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://kb_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";

        # ⚠️ SSE 流式输出（AI 育儿助手逐字返回）必须关缓冲，否则会攒到结束才一次性吐出
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;   # 长对话推理耗时较长
    }

    # 静态资源长缓存（Next 构建产物的 hash 文件名可安全 immutable）
    location /_next/static/ {
        proxy_pass http://kb_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 邀请二维码 PNG/SVG 短缓存即可
    location /api/invite/qr {
        proxy_pass http://kb_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}

